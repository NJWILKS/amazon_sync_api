[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-sync-api"
version = "0.1.0"
description = "Experimental upload-only Amazon Photos folder-tree integration"
requires-python = ">=3.11"

[project.scripts]
amazon-sync = "amazon_sync_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
